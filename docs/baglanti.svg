<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 80 780 345" width="780" height="345" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>BCT 22 CANopen bağlantı şeması</title>
  <rect y="80" width="780" height="345" fill="#ffffff"/>

  <!-- Sensor -->
  <rect x="30" y="95" width="140" height="240" rx="6" fill="#FAECE7" stroke="#222" stroke-width="1.5"/>
  <text x="100" y="116" font-size="15" font-weight="bold" text-anchor="middle" fill="#222">BCT 22</text>
  <text x="100" y="133" font-size="12" text-anchor="middle" fill="#444">CANopen · M12</text>
  <text x="160" y="164" font-size="12" text-anchor="end" fill="#222">SHIELD 1</text>
  <text x="160" y="204" font-size="12" text-anchor="end" fill="#222">U+ 2</text>
  <text x="160" y="244" font-size="12" text-anchor="end" fill="#222">GND 3</text>
  <text x="160" y="284" font-size="12" text-anchor="end" fill="#222">CAN_H 4</text>
  <text x="160" y="324" font-size="12" text-anchor="end" fill="#222">CAN_L 5</text>

  <!-- Kart -->
  <rect x="440" y="95" width="320" height="260" rx="6" fill="#F7F7F5" stroke="#222" stroke-width="1.5"/>
  <text x="600" y="117" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Uçuş bilgisayarı kartı</text>

  <!-- Teller -->
  <g fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M170 160 L470 160" stroke="#888888" stroke-dasharray="6 4"/>
    <path d="M170 200 L470 200" stroke="#C0392B"/>
    <path d="M170 240 L470 240" stroke="#222222"/>
    <path d="M170 280 L580 280" stroke="#C9A100"/>
    <path d="M170 320 L580 320" stroke="#2E8B57"/>
  </g>

  <!-- Tel renkleri -->
  <text x="176" y="154" font-size="11" fill="#666">örgü</text>
  <text x="176" y="194" font-size="11" fill="#C0392B">kırmızı</text>
  <text x="176" y="234" font-size="11" fill="#222">siyah</text>
  <text x="176" y="274" font-size="11" fill="#9A7B00">sarı</text>
  <text x="176" y="314" font-size="11" fill="#2E8B57">yeşil</text>

  <text x="320" y="146" font-size="12" text-anchor="middle" fill="#444">M12 5 pin kablo</text>
  <text x="370" y="304" font-size="12" text-anchor="middle" fill="#444">bükümlü çift</text>

  <!-- Kart icindeki uclar -->
  <g stroke="#222" stroke-width="1.5" fill="none">
    <path d="M470 160 L470 170 M460 170 L480 170 M463 175 L477 175 M466 180 L474 180"/>
  </g>
  <circle cx="470" cy="200" r="3.5" fill="#C0392B"/>
  <circle cx="470" cy="240" r="3.5" fill="#222"/>
  <text x="488" y="164" font-size="12" fill="#222">Şase / GND (tek uçta)</text>
  <text x="480" y="204" font-size="12" fill="#222">8-26 V besleme</text>
  <text x="480" y="244" font-size="12" fill="#222">GND</text>

  <!-- Sonlandirma: kart tarafi -->
  <g stroke="#222" stroke-width="1.5" fill="none">
    <path d="M540 280 L540 290 M540 310 L540 320"/>
    <rect x="534" y="290" width="12" height="20"/>
  </g>
  <circle cx="540" cy="280" r="3" fill="#222"/>
  <circle cx="540" cy="320" r="3" fill="#222"/>
  <text x="540" y="342" font-size="12" text-anchor="middle" fill="#222">120 Ω</text>

  <!-- Sonlandirma: sensor tarafi (opsiyonel, dahili) -->
  <g stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="3 3">
    <path d="M230 280 L230 290 M230 310 L230 320"/>
    <rect x="224" y="290" width="12" height="20"/>
  </g>
  <text x="215" y="350" font-size="12" fill="#666">120 Ω (dahili, opsiyonel)</text>

  <!-- SN65HVD230 -->
  <rect x="580" y="255" width="170" height="90" rx="4" fill="#EEEDFE" stroke="#222" stroke-width="1.5"/>
  <text x="588" y="284" font-size="12" fill="#222">7 CANH</text>
  <text x="588" y="324" font-size="12" fill="#222">6 CANL</text>
  <text x="702" y="273" font-size="12" font-weight="bold" text-anchor="middle" fill="#222">SN65HVD230</text>
  <text x="702" y="292" font-size="12" text-anchor="middle" fill="#444">D ← PA12</text>
  <text x="702" y="310" font-size="12" text-anchor="middle" fill="#444">R → PA11</text>
  <text x="702" y="328" font-size="12" text-anchor="middle" fill="#444">Rs → GND</text>

  <!-- Notlar -->
  <text x="390" y="385" font-size="12" text-anchor="middle" fill="#444">Güç kapalıyken CANH - CANL arası ≈ 60 Ω olmalı (hattın iki ucunda birer 120 Ω)</text>
  <text x="390" y="408" font-size="12" text-anchor="middle" fill="#A32D2D">Besleme ve sinyal uçlarını ters bağlamak sensörü bozar (ATEK uyarısı)</text>
</svg>
